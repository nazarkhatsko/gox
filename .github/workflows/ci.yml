name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          install-only: true

      - name: Format
        run: golangci-lint fmt --diff ./...

      - name: Lint
        run: golangci-lint run ./...

      - name: Tests
        run: go test -race ./...

  release:
    # A pushed tag that passed the checks becomes a GitHub release with notes
    # generated from the commits since the previous tag.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags="--verify-tag --generate-notes"
          case "$TAG" in *-*) flags="$flags --prerelease" ;; esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" $flags
