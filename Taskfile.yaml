version: "3"

# Print command output only, not the commands themselves.
silent: true

tasks:
  fmt:
    desc: "Format code (gofumpt + import grouping, see .golangci.yml)"
    cmd: golangci-lint fmt ./...

  fmt:check:
    desc: "Fail if any file is not formatted"
    cmd: golangci-lint fmt --diff ./...

  lint:
    desc: "Run linter"
    cmd: golangci-lint run ./...

  lint:fix:
    desc: "Run linter with auto-fix"
    cmd: golangci-lint run --fix ./...

  test:
    desc: "Run tests with the race detector"
    cmd: go test -race ./...

  test:cover:
    desc: "Run tests and report coverage per package"
    cmd: go test -race -cover ./...

  tidy:
    desc: "Tidy go.mod and go.sum"
    cmd: go mod tidy

  check:
    desc: "Run format check, lint and tests, as before push, release and in CI"
    cmd: ./bin/check

  hooks:
    desc: "Enable git hooks from .githooks (format on commit; lint and test on push)"
    cmd: git config core.hooksPath .githooks

  release:
    desc: "Check, tag and push a version (usage: task release, or task release -- v1.2.3)"
    interactive: true
    cmd: ./bin/release {{.CLI_ARGS}}
